# Dabcam Phase 2: Security Scanning Configuration
# Comprehensive SAST, DAST, dependency, and secret scanning setup

---
# 1. STATIC APPLICATION SECURITY TESTING (SAST)
# ================================================

sast_tools:
  semgrep:
    name: "Semgrep - Fast SAST with Rules Registry"
    docker_image: "returntocorp/semgrep:latest"
    rules:
      - p/security-audit
      - p/owasp-top-ten
      - p/python
      - p/flask
      - p/sqlalchemy
    ci_integration: true
    command: "semgrep --config=p/security-audit --json --output=semgrep-results.json ."

  codeql:
    name: "GitHub CodeQL - Semantic Code Analysis"
    docker_image: "ghcr.io/github/codeql-cli/latest"
    languages:
      - python
      - javascript
    databases:
      - python-db
      - javascript-db
    ci_integration: true
    command: "codeql database create --language=python --source-root=. python-db"

  dependency_check:
    name: "OWASP Dependency-Check"
    docker_image: "owasp/dependency-check:latest"
    scan_formats:
      - requirements.txt
      - package.json
      - package-lock.json
    ci_integration: true
    command: "dependency-check --project 'Dabcam' --scan . --format JSON"

---
# 2. DEPENDENCY VULNERABILITY SCANNING
# =====================================

dependency_scanners:
  trivy:
    name: "Trivy - Multi-scanner (containers, IaC, deps, secrets)"
    docker_image: "aquasec/trivy:latest"
    scan_targets:
      - container_images
      - filesystem
      - git_repositories
      - sbom
    command: "trivy image --format json --output trivy-results.json IMAGE_NAME"

  grype:
    name: "Anchore Grype - Vulnerability Scanner"
    docker_image: "anchore/grype:latest"
    scan_formats:
      - container_images
      - sbom
      - directory
    command: "grype -o json IMAGE_NAME"

  osv_scanner:
    name: "Google OSV-Scanner - OSV Database Scanning"
    docker_image: "ghcr.io/google/osv-scanner:latest"
    scan_targets:
      - lockfiles
      - git_repositories
    command: "osv-scanner --json --lockfile=requirements.txt"

  syft:
    name: "Anchore Syft - SBOM Generation"
    docker_image: "anchore/syft:latest"
    output_formats:
      - json
      - spdx-json
      - cyclonedx-json
    command: "syft -o json IMAGE_NAME > sbom.json"

---
# 3. SECRET DETECTION
# ===================

secret_scanners:
  gitleaks:
    name: "GitLeaks - Git Secret Detection"
    docker_image: "zricethezav/gitleaks:latest"
    scan_modes:
      - protect_mode
      - audit_mode
    patterns:
      - api_keys
      - aws_keys
      - private_keys
      - passwords
      - tokens
    command: "gitleaks detect --source . --verbose"

  trufflehog:
    name: "TruffleHog - Git History Secret Scanning"
    docker_image: "ghcr.io/trufflesecurity/trufflehog:latest"
    detectors:
      - api_keys
      - aws_credentials
      - slack_tokens
      - github_tokens
      - private_keys
      - database_passwords
    command: "trufflehog filesystem . --json"

  trivy_secrets:
    name: "Trivy Secret Scanning"
    embedded_in: "trivy"
    scan_types:
      - api_keys
      - credentials
      - private_keys
    command: "trivy secret ."

---
# 4. DYNAMIC APPLICATION SECURITY TESTING (DAST)
# ==============================================

dast_tools:
  zap:
    name: "OWASP ZAP - Web App Security Scanner"
    docker_image: "owasp/zap2docker-stable:latest"
    scan_modes:
      - passive_scan
      - active_scan
      - api_scan
    targets:
      - http://localhost:8001
    command: "zap.sh -t http://localhost:8001 -r zap-report.html"

  nuclei:
    name: "ProjectDiscovery Nuclei - Vulnerability Scanner"
    docker_image: "projectdiscovery/nuclei:latest"
    templates:
      - cves
      - exposures
      - misconfigurations
      - vulnerabilities
    command: "nuclei -u http://localhost:8001 -t cves,exposures -json"

  sqlmap:
    name: "SQLMap - SQL Injection Scanner"
    targets:
      - http://localhost:8001/api/*
    command: "sqlmap -u 'http://localhost:8001/api/campaigns' --dbs --batch"

---
# 5. CONTAINER SECURITY
# ====================

container_security:
  image_scanning:
    registry: "Docker Hub / GitHub Container Registry"
    scan_on:
      - build
      - push
      - pull
    tools:
      - trivy
      - grype
      - clair

  runtime_scanning:
    tools:
      - falco
      - sysdig
    monitors:
      - syscalls
      - network_traffic
      - file_access

  admission_control:
    policies:
      - image_verification
      - vulnerability_threshold
      - resource_limits

---
# 6. INFRASTRUCTURE AS CODE (IaC) SCANNING
# ========================================

iac_scanning:
  targets:
    - docker-compose.yml
    - Dockerfile
    - kubernetes_manifests
    - terraform_configs

  tools:
    trivy_iac:
      name: "Trivy IaC Scanning"
      command: "trivy config ."

    checkov:
      name: "Bridgecrews Checkov"
      command: "checkov -d ."

    tfsec:
      name: "Terraform Security Scanner"
      command: "tfsec ."

---
# 7. CI/CD INTEGRATION
# ===================

ci_pipelines:
  pre_commit_hooks:
    - gitleaks
    - semgrep
    - dependency-check
    - bandit

  github_actions:
    workflows:
      - sast_scan.yml
      - dependency_scan.yml
      - secret_scan.yml
      - container_scan.yml
      - dast_scan.yml

  pull_request_checks:
    - semgrep
    - codeql
    - osv-scanner
    - dependency-check
    - gitleaks

  pre_deployment:
    - trivy_image_scan
    - osv_scanner
    - nuclei_scan
    - zap_scan

---
# 8. VULNERABILITY MANAGEMENT
# ===========================

vulnerability_management:
  aggregation:
    consolidate_from:
      - semgrep
      - codeql
      - dependency-check
      - trivy
      - grype
      - osv-scanner

  severity_mapping:
    critical: "CVSS >= 9.0"
    high: "CVSS 7.0-8.9"
    medium: "CVSS 4.0-6.9"
    low: "CVSS 0.1-3.9"

  reporting:
    formats:
      - json
      - sarif
      - html

  remediation:
    prioritize_by:
      - severity
      - exploitability
      - remediation_difficulty
      - component_criticality

---
# 9. CONFIGURATION
# ===============

scan_schedule:
  on_code_push: true
  on_pull_request: true
  on_schedule: "daily at 2 AM"
  on_deployment: true

thresholds:
  fail_on_critical: true
  fail_on_high: false
  fail_on_medium: false
  fail_on_low: false

quality_gates:
  max_critical: 0
  max_high: 5
  max_medium: 20
  max_low: 100

---
# 10. REMEDIATION WORKFLOW
# ======================

remediation:
  issue_tracking:
    platform: GitHub Issues
    labels:
      - security
      - critical
      - vulnerability

  sla:
    critical: "4 hours"
    high: "24 hours"
    medium: "7 days"
    low: "30 days"

  verification:
    re_scan_after_fix: true
    require_approved_fix: true
    prevent_regression: true
